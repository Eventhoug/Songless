<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Songless Infinite</title>
  <meta name="description" content="Guess the song from a tiny clip. Endless rounds, start or hook mode, rock, pop and hip-hop filters.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23151a2e'/%3E%3Cpath d='M9 17V7l9-2v10' fill='none' stroke='%23f5b83d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='7' cy='17' r='2' fill='%23f5b83d'/%3E%3Ccircle cx='16' cy='15' r='2' fill='%23f5b83d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="./">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V7l9-2v10"/><circle cx="7" cy="17" r="2"/><circle cx="16" cy="15" r="2"/></svg>
        <span>Songless</span><span class="tag">Infinite</span>
      </a>
      <div class="stats" aria-live="polite">
        <div class="stat"><span class="stat-value" id="stat-score">0</span><span class="stat-label">Score</span></div>
        <div class="stat"><span class="stat-value" id="stat-streak">0</span><span class="stat-label">Streak</span></div>
        <div class="stat"><span class="stat-value" id="stat-best">0</span><span class="stat-label">Best</span></div>
      </div>
    </header>

    <section class="controls" aria-label="Game settings">
      <div class="segmented" role="group" aria-label="Where the clip starts" id="mode-buttons">
        <button type="button" data-mode="start">Start of song</button>
        <button type="button" data-mode="hook">Main hook</button>
      </div>
      <div class="chips" role="group" aria-label="Genre" id="genre-buttons"></div>
    </section>

    <section class="card notice" id="loading">
      <p>Loading songs...</p>
    </section>

    <section class="card notice" id="empty" hidden>
      <h2 id="empty-title">No playable songs yet</h2>
      <div id="empty-body"></div>
    </section>

    <main class="card game" id="game" hidden>
      <div class="video-frame" id="video-frame">
        <div id="player"></div>
        <div class="cover" id="cover">
          <div class="eq" id="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
          <p class="cover-title" id="cover-title">Song 1</p>
          <p class="cover-sub" id="cover-sub"></p>
        </div>
      </div>

      <ol class="attempts" id="attempts" aria-label="Your guesses"></ol>

      <div class="timeline-wrap">
        <div class="timeline" id="timeline" aria-hidden="true">
          <div class="unlocked" id="unlocked"></div>
          <div class="progress" id="progress"></div>
        </div>
        <div class="timeline-labels">
          <span>0:00</span>
          <span id="clip-label">0.5 s unlocked</span>
          <span>16 s</span>
        </div>
      </div>

      <div class="play-row">
        <button type="button" class="play" id="play-btn" aria-label="Play clip">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
        </button>
      </div>

      <div class="guess-area" id="guess-area">
        <div class="guess-box">
          <input id="guess-input" type="text" placeholder="Know it? Search for the title or artist" autocomplete="off" spellcheck="false"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">
          <ul id="suggestions" role="listbox" hidden></ul>
        </div>
        <div class="guess-buttons">
          <button type="button" class="secondary" id="skip-btn">Skip (+0.5 s)</button>
          <button type="button" class="primary" id="submit-btn">Submit</button>
        </div>
        <button type="button" class="link" id="giveup-btn">Give up</button>
      </div>

      <div class="reveal" id="reveal" hidden>
        <p class="reveal-result" id="reveal-result"></p>
        <h2 class="reveal-title" id="reveal-title"></h2>
        <p class="reveal-artist" id="reveal-artist"></p>
        <p class="reveal-points" id="reveal-points"></p>
        <button type="button" class="primary big" id="next-btn">Next song</button>
      </div>
    </main>

    <footer class="footer">
      <span id="song-count"></span>
      <label class="volume">Volume <input type="range" id="volume" min="0" max="100" step="1"></label>
      <a href="editor.html">Add or fix a song</a>
      <button type="button" class="link" id="reset-stats">Reset stats</button>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>
</body>
</html>
